[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "smartci"
version = "0.2.0a2"
description = "Conservative test impact analysis contracts and CLI"
requires-python = ">=3.13"
dependencies = ["pydantic>=2.10,<3"]

[project.optional-dependencies]
pytest = ["pytest>=8,<10"]

[project.scripts]
smartci = "smartci.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "mypy>=1.14,<2"]

[tool.ruff]
target-version = "py313"

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
