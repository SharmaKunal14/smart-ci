name: Model budget controls
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: smartci-model-budget
  cancel-in-progress: false
jobs:
  disabled-ledger-probe:
    if: >-
      github.repository == 'SharmaKunal14/smart-ci' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/live-investigation'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.11.6'
          enable-cache: false
      - run: uv sync --frozen
      - name: Verify stale-write rejection and disabled admission
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run --frozen python scripts/budget_cas_probe.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: model-budget-probe-${{ github.run_attempt }}
          path: budget-probe.json
          if-no-files-found: error
          retention-days: 14
  live-public-trial:
    needs: disabled-ledger-probe
    if: >-
      vars.SMARTCI_LIVE_CAMPAIGN == 'textual-public-20261123' &&
      github.repository == 'SharmaKunal14/smart-ci' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/live-investigation'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.11.6'
          enable-cache: false
      - run: uv sync --frozen
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: SharmaKunal14/textual
          ref: b99f72e9691c85f18fd773df427cb5e7a493470d
          fetch-depth: 0
          persist-credentials: false
          path: subject
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: SharmaKunal14/textual
          run-id: 45058699772
          name: textual-assisted-replay-1
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/source-evidence
      - name: Investigate pinned public PR evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          uv run --frozen python scripts/textual_live_trial.py \
            --artifact "$RUNNER_TEMP/source-evidence/investigation-input.json" \
            --repo "$GITHUB_WORKSPACE/subject" \
            --output "$RUNNER_TEMP/live-trial"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: model-live-trial-${{ github.run_attempt }}
          path: ${{ runner.temp }}/live-trial
          if-no-files-found: error
          retention-days: 14
