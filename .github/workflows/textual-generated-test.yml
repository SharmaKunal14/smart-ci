name: Textual one-method test generation
on:
  pull_request:
    branches: [codex/runtime-read-provenance]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  actions: read
concurrency:
  group: textual-generated-test
  cancel-in-progress: false
env:
  BASE_SHA: e6b3a6962a1ecd2ea20facbd2560d68a65c0fbd8
  DEFECT_SHA: f1a9d30986616a922871020df233f883ead8dc82
  ENROLLMENT_RUN: '45862622090'
  GENERATED_SHA: 8954efa2d402c22be382dc3a92a7f05cab865663
  GENERATED_FILE_SHA256: 3f4db313d52e6d09b658fe48c4a16cfadb90e04da14648c8f6ebefc723cecffe
jobs:
  generate:
    # Retired by user direction. Historical workflows and artifacts remain in Git.
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write # Conditional budget ledger update; generated code is never executed here.
      actions: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: tool
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: SharmaKunal14/textual
          ref: ${{ env.BASE_SHA }}
          fetch-depth: 0
          path: app
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.11.6'
          enable-cache: false
      - name: Install isolated generator; do not install or execute Textual
        run: uv sync --project tool --frozen --no-dev --python 3.14
      - name: Retrieve original native coverage and enrollment
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/enrollment"
          gh api "repos/SharmaKunal14/textual/actions/runs/$ENROLLMENT_RUN" > "$RUNNER_TEMP/enrollment/run.json"
          gh api "repos/SharmaKunal14/textual/actions/runs/$ENROLLMENT_RUN/attempts/1/jobs?per_page=100" > "$RUNNER_TEMP/enrollment/jobs.json"
          gh run download "$ENROLLMENT_RUN" --repo SharmaKunal14/textual --pattern 'textual-native-1' --pattern 'textual-observe-scoped-1' --dir "$RUNNER_TEMP/enrollment"
      - name: Propose one test with at most four approved API calls; save only
        timeout-minutes: 4
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SMARTCI_DISABLE_MODEL_CALLS: '0'
        run: |
          tool/.venv/bin/python tool/examples/textual/generate_test.py --repo app \
            --enrollment "$RUNNER_TEMP/enrollment" --output "$RUNNER_TEMP/proposal" \
            --repair-feedback tool/examples/textual/generated-test-working-feedback.json
      - name: Disable campaign without resetting reservations
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: tool/.venv/bin/python tool/scripts/disable_model_campaign.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: textual-generated-proposal-${{ github.run_attempt }}
          path: ${{ runner.temp }}/proposal
          retention-days: 14
          if-no-files-found: error
  reviewed-test:
    if: ${{ false }}
    name: generated-${{ matrix.revision }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        revision: ${{ fromJSON(vars.SMARTCI_TEXTUAL_GENERATION_TRIAL == 'verify-working' && '["working"]' || vars.SMARTCI_TEXTUAL_GENERATION_TRIAL == 'verify-heldout' && '["defect"]' || '[]') }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: tool
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: SharmaKunal14/textual
          ref: ${{ matrix.revision == 'working' && env.BASE_SHA || env.DEFECT_SHA }}
          fetch-depth: 0
          path: app
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - name: Install unchanged native locked profile
        working-directory: app
        run: |
          pipx install poetry==1.7.1
          poetry env use "$pythonLocation/bin/python"
          poetry install --no-interaction --extras syntax
      - name: Record profile and copy the reviewed test without changing its bytes
        working-directory: app
        env:
          SOURCE_SHA: ${{ matrix.revision == 'working' && env.BASE_SHA || env.DEFECT_SHA }}
        run: |
          poetry run python ../tool/examples/textual/runtime_candidate.py --mode profile \
            --base "$BASE_SHA" --head "$SOURCE_SHA" --output "$RUNNER_TEMP/results"
          git diff --exit-code
          test ! -e tests/test_smartci_generated_markdown.py
          git show "$GENERATED_SHA:tests/test_smartci_generated_markdown.py" > "$RUNNER_TEMP/reviewed-test.py"
          echo "$GENERATED_FILE_SHA256  $RUNNER_TEMP/reviewed-test.py" | sha256sum --check
          cp "$RUNNER_TEMP/reviewed-test.py" tests/test_smartci_generated_markdown.py
          mkdir -p "$RUNNER_TEMP/results/generated" "$RUNNER_TEMP/results/surrounding"
      - name: Run the exact generated test alone with independent coverage
        working-directory: app
        run: |
          poetry run python -m pytest tests/test_smartci_generated_markdown.py -v \
            --cov=./src/textual --cov-report=term-missing \
            --cov-report="xml:$RUNNER_TEMP/results/generated/coverage.xml" \
            --junitxml="$RUNNER_TEMP/results/generated/junit.xml"
      - name: Run existing surrounding Markdown tests on working source
        if: always() && matrix.revision == 'working'
        working-directory: app
        run: |
          poetry run python -m pytest tests/test_markdown.py tests/test_markdownviewer.py \
            tests/snapshot_tests/test_snapshots.py -k markdown -v \
            --cov=./src/textual --cov-report=term-missing \
            --cov-report="xml:$RUNNER_TEMP/results/surrounding/coverage.xml" \
            --junitxml="$RUNNER_TEMP/results/surrounding/junit.xml"
      - name: Require passing cases and actual target-body execution before held-out evaluation
        if: success() && matrix.revision == 'working'
        working-directory: app
        run: |
          poetry run python ../tool/examples/textual/check_generated_test.py \
            --coverage "$RUNNER_TEMP/results/generated/coverage.xml" \
            --junit "$RUNNER_TEMP/results/generated/junit.xml"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: textual-generated-${{ matrix.revision }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/results
          retention-days: 14
          if-no-files-found: error
  original-suite:
    if: ${{ false }}
    name: original-${{ matrix.revision }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        revision: [working, defect]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: tool
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: SharmaKunal14/textual
          ref: ${{ matrix.revision == 'working' && env.BASE_SHA || env.DEFECT_SHA }}
          fetch-depth: 0
          path: app
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - name: Install unchanged native locked profile
        working-directory: app
        run: |
          pipx install poetry==1.7.1
          poetry env use "$pythonLocation/bin/python"
          poetry install --no-interaction --extras syntax
      - name: Execute original full suite without generated tests
        working-directory: app
        env:
          SOURCE_SHA: ${{ matrix.revision == 'working' && env.BASE_SHA || env.DEFECT_SHA }}
        run: |
          poetry run python ../tool/examples/textual/runtime_candidate.py --mode native \
            --base "$BASE_SHA" --head "$SOURCE_SHA" --output "$RUNNER_TEMP/results"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: textual-original-${{ matrix.revision }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/results
          retention-days: 14
          if-no-files-found: error
