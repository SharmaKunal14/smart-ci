name: Smart CI experimental Maven reactor
description: Reviewed module selection and full fallback through the pinned Smart CI CLI
inputs:
  path:
    description: Exact clean PR head checkout
    default: '.'
  config:
    description: Maven policy read from the reviewed PR base
    default: '.github/smartci-maven.toml'
runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      continue-on-error: true
      with:
        python-version: '3.14'
    - name: Validate PR context and read base-owned policy
      id: context
      shell: bash
      env:
        ACTION_ROOT: ${{ github.action_path }}/..
        SOURCE_PATH: ${{ inputs.path }}
        CONFIG_PATH: ${{ inputs.config }}
      run: python3 -I "$ACTION_ROOT/action/maven_bootstrap.py" stage
    - name: Install verified pinned Smart CI CLI
      id: install
      continue-on-error: true
      shell: bash
      env:
        ACTION_ROOT: ${{ github.action_path }}/..
      run: python3 -I "$ACTION_ROOT/action/bootstrap.py" install
    - name: Run native Maven selection or independent full fallback
      shell: bash
      env:
        ACTION_ROOT: ${{ github.action_path }}/..
        CONFIG_PATH: ${{ inputs.config }}
        CLI_READY: ${{ steps.install.outcome == 'success' }}
      run: python3 -I "$ACTION_ROOT/action/maven_bootstrap.py" execute
    - name: Summarize native execution
      if: always() && steps.context.outcome == 'success'
      shell: bash
      env:
        ACTION_ROOT: ${{ github.action_path }}/..
      run: python3 -I "$ACTION_ROOT/action/maven_bootstrap.py" summary
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always() && steps.context.outcome == 'success'
      with:
        name: smartci-maven-${{ github.job }}-${{ github.run_attempt }}
        path: ${{ steps.context.outputs.state }}/result
        retention-days: 7
        if-no-files-found: error
