---
name: Published Action same-VM controlled comparison
'on':
  pull_request:
    branches:
    - codex/action-matched-base
    types:
    - opened
    - synchronize
    - reopened
permissions:
  contents: read
  actions: read
cache-mode: read
concurrency:
  group: action-matched-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  compare:
    if: startsWith(github.head_ref, 'codex/action-matched-') && github.event.pull_request.head.repo.full_name
      == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        ref: "${{ github.event.pull_request.head.sha }}"
        path: source
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        repository: SharmaKunal14/smart-ci
        ref: e780aeb00eb5b81c35b062c65734067c03279754
        path: tool
        persist-credentials: false
    - name: Load only the base-owned measurement helper and declared order
      id: order
      run: |
        /usr/bin/python3 - <<'PY'
        import os,sys
        from pathlib import Path
        sys.path.insert(0,str(Path('tool/src').resolve()))
        from smartci.action_control import context,base_file
        value=context(Path('source').resolve(),Path(os.environ['GITHUB_EVENT_PATH']),os.environ['GITHUB_REPOSITORY'],os.environ['GITHUB_EVENT_NAME'])
        raw=base_file(value,'.smartci/matched_trial.py')
        if len(raw)>32768:raise SystemExit('Oversized measurement helper')
        with (Path(os.environ['RUNNER_TEMP'])/'matched_trial.py').open('xb') as stream:stream.write(raw)
        PY
        /usr/bin/python3 "$RUNNER_TEMP/matched_trial.py" init
    - name: Discover the approved cache seed for the exact PR base
      id: seed
      continue-on-error: true
      timeout-minutes: 2
      env:
        GH_TOKEN: "${{ github.token }}"
        BASE: "${{ github.event.pull_request.base.sha }}"
      run: |
        python3 - <<'PYCODE'
        import os,sys
        from pathlib import Path
        sys.path.insert(0,str(Path('tool/src').resolve()))
        from smartci.action_control import context,base_file
        value=context(Path('source').resolve(),Path(os.environ['GITHUB_EVENT_PATH']),os.environ['GITHUB_REPOSITORY'],os.environ['GITHUB_EVENT_NAME'])
        if value['base']!=os.environ['BASE']:
            raise SystemExit('Exact PR base required')
        raw=base_file(value,'.smartci/cache-publisher.json')
        if len(raw)>16384:
            raise SystemExit('Oversized publisher policy')
        (Path(os.environ['RUNNER_TEMP'])/'approved-publisher.json').write_bytes(raw)
        PYCODE
        python3 tool/examples/abseil/cache_seed_run.py \
          --publisher "$RUNNER_TEMP/approved-publisher.json" --revision "$BASE" \
          --output "$RUNNER_TEMP/cache-seed-run.json"
    - name: Download the reviewed seed receipt independently of cache bytes
      id: receipt
      if: steps.seed.outcome == 'success'
      continue-on-error: true
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        repository: SharmaKunal14/abseil-cpp
        run-id: "${{ steps.seed.outputs.run_id }}"
        name: native-cache-receipt-${{ steps.seed.outputs.run_attempt }}
        github-token: "${{ github.token }}"
        path: "${{ runner.temp }}/native-cache-receipt"
    - name: Validate base, tool and profile identity before cache lookup
      id: identity
      if: steps.receipt.outcome == 'success'
      continue-on-error: true
      env:
        BASE: "${{ github.event.pull_request.base.sha }}"
      run: |
        python3 - <<'PYCODE'
        import hashlib, json, os
        from pathlib import Path
        path = Path(os.environ['RUNNER_TEMP'])/'native-cache-receipt/identity.json'
        if path.stat().st_size > 4096:
            raise SystemExit('Oversized seed identity')
        base = os.environ['BASE']
        if len(base) != 40 or set(base) - set('0123456789abcdef'):
            raise SystemExit('Exact base required')
        profile = hashlib.sha256(Path('tool/examples/abseil/cache-profile.json').read_bytes()).hexdigest()
        producer = 'e780aeb00eb5b81c35b062c65734067c03279754'
        key = 'smartci-native-v1-' + base + '-' + profile + '-' + producer
        expected = {'schema_version':'1','revision':base,'key':key,'profile_sha256':profile,'tool_revision':producer}
        if json.loads(path.read_bytes()) != expected:
            raise SystemExit('Seed identity does not match the reviewed base/profile')
        with open(os.environ['GITHUB_OUTPUT'],'a') as output:
            output.write('key=' + key + '\n')
        PYCODE
    - name: Bound unused system crash processing on this disposable runner
      id: cores
      run: |
        mkdir "$RUNNER_TEMP/runner-policy"
        lscpu --json > "$RUNNER_TEMP/runner-policy/cpu.json"
        systemd-analyze cat-config systemd/coredump.conf > "$RUNNER_TEMP/runner-policy/before.conf"
        python3 - <<'PY'
        from pathlib import Path
        value = Path('/proc/sys/kernel/core_pattern').read_text()
        if not value.startswith('|/usr/lib/systemd/systemd-coredump '):
            raise SystemExit('Unexpected core handler; no profile change performed')
        PY
        test ! -e /etc/systemd/coredump.conf.d/90-smartci-baseline.conf
        printf '[Coredump]\nStorage=none\nProcessSizeMax=0\n' > "$RUNNER_TEMP/runner-policy/90-smartci-baseline.conf"
        sudo install -d -m 0755 /etc/systemd/coredump.conf.d
        sudo install -m 0644 "$RUNNER_TEMP/runner-policy/90-smartci-baseline.conf" /etc/systemd/coredump.conf.d/90-smartci-baseline.conf
        echo 'created=true' >> "$GITHUB_OUTPUT"
        if systemctl is-active --quiet systemd-coredumpd.service; then
          sudo systemctl reload systemd-coredumpd.service
        fi
        systemd-analyze cat-config systemd/coredump.conf > "$RUNNER_TEMP/runner-policy/effective.conf"
        python3 - <<'PY'
        import configparser, os
        from pathlib import Path
        config = configparser.ConfigParser(strict=False, interpolation=None)
        config.read(Path(os.environ['RUNNER_TEMP']) / 'runner-policy/effective.conf')
        if dict(config['Coredump']).get('storage') != 'none' or config['Coredump'].get('ProcessSizeMax') != '0':
            raise SystemExit('Crash-processing policy did not take effect')
        PY
    - name: Bound the separate Apport crash-report hook
      id: apport
      run: |
        systemctl cat systemd-coredump@.service > "$RUNNER_TEMP/runner-policy/systemd-coredump-unit.txt"
        systemctl cat apport-coredump-hook@.service > "$RUNNER_TEMP/runner-policy/apport-unit.txt"
        systemctl show systemd-coredump@smartci-probe.service --property=OnSuccess --value > "$RUNNER_TEMP/runner-policy/on-success.txt"
        systemctl show apport-coredump-hook@smartci-probe.service --property=ExecStart --value > "$RUNNER_TEMP/runner-policy/apport-command.txt"
        python3 - <<'PY'
        import os
        from pathlib import Path
        root = Path(os.environ['RUNNER_TEMP']) / 'runner-policy'
        if 'apport-coredump-hook@smartci-probe.service' not in (root / 'on-success.txt').read_text().split():
            raise SystemExit('Expected Apport hook not installed; no mask performed')
        command = (root / 'apport-command.txt').read_text()
        if 'path=/usr/share/apport/apport ;' not in command or '--from-systemd-coredump smartci-probe' not in command:
            raise SystemExit('Unexpected Apport command; no mask performed')
        PY
        test "$(systemctl show apport-coredump-hook@smartci-probe.service --property=LoadState --value)" = loaded
        test ! -e /run/systemd/system/apport-coredump-hook@.service
        test ! -L /run/systemd/system/apport-coredump-hook@.service
        sudo systemctl mask --runtime apport-coredump-hook@.service
        echo 'created=true' >> "$GITHUB_OUTPUT"
        systemctl show apport-coredump-hook@smartci-probe.service --property=LoadState --value > "$RUNNER_TEMP/runner-policy/apport-effective.txt"
        test "$(cat "$RUNNER_TEMP/runner-policy/apport-effective.txt")" = masked
    - name: Load the identical compiler image before either measured arm
      timeout-minutes: 10
      env:
        IMAGE: gcr.io/google.com/absl-177019/linux_hybrid-latest@sha256:baa99e65a3cc837bab8e5246f1870d25c76d0adf2b1d598ee5a3ec77fd2e19bd
      run: |
        docker pull "$IMAGE"
        docker image inspect "$IMAGE" > "$RUNNER_TEMP/common-image.json"
        /usr/bin/python3 - <<'PY'
        import json,os,shutil
        from pathlib import Path
        root=Path(os.environ['RUNNER_TEMP']);images=json.loads((root/'common-image.json').read_bytes())
        if len(images)!=1 or os.environ['IMAGE'] not in images[0]['RepoDigests']:
            raise SystemExit('Compiler image digest mismatch')
        usage=shutil.disk_usage(root)
        (root/'matched-evidence/disk.json').write_text(json.dumps({'total':usage.total,'used':usage.used,'free':usage.free})+'\n')
        receipt=root/'native-cache-receipt/cache.json'
        required=2*json.loads(receipt.read_bytes())['bytes']+1024**3 if receipt.is_file() else 3*1024**3
        if usage.free<required:raise SystemExit('Insufficient disk for independent native caches')
        PY
    - name: Begin full_first measured interval
      id: full_first_begin
      if: always() && !cancelled() && steps.order.outcome == 'success' && steps.order.outputs.first
        == 'full'
      run: /usr/bin/python3 "$RUNNER_TEMP/matched_trial.py" begin --arm full
    - name: Independently restore base cache for full_first
      id: full_first_cache
      if: always() && !cancelled() && steps.order.outcome == 'success' && steps.order.outputs.first
        == 'full' && steps.identity.outcome == 'success'
      continue-on-error: true
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      timeout-minutes: 3
      with:
        path: "${{ runner.temp }}/native-cache"
        key: "${{ steps.identity.outputs.key }}"
    - name: Verify independent cache contents for full_first
      id: full_first_verified
      if: always() && !cancelled() && steps.order.outcome == 'success' && steps.order.outputs.first
        == 'full' && steps.full_first_cache.outputs.cache-hit == 'true'
      continue-on-error: true
      timeout-minutes: 3
      run: |
        python3 tool/examples/abseil/native_cache.py --directory "$RUNNER_TEMP/native-cache" \
          --expected "$RUNNER_TEMP/native-cache-receipt/cache.json" --output "$RUNNER_TEMP/matched-evidence/full/cache-verified.json"
    - name: Match memory-cache state before full_first
      if: always() && !cancelled() && steps.order.outcome == 'success' && steps.order.outputs.first
        == 'full'
      timeout-minutes: 2
      env:
        ARM: full
      run: |
        test -z "$(docker ps -q)"
        sudo sh -eu -c 'sync
        printf 3 > /proc/sys/vm/drop_caches'
        /usr/bin/python3 - <<'PY'
        import json,os
        from pathlib import Path
        path=Path(os.environ['RUNNER_TEMP'])/'matched-evidence'/os.environ['ARM']/'native-preparation.json'
        with path.open('x') as stream:stream.write(json.dumps({'page_cache_reset':True,'no_active_containers':True})+'\n')
        PY
    - name: Execute unchanged full native suite for full_first
      id: full_first_run
      if: always() && !cancelled() && steps.order.outcome == 'success' && steps.order.outputs.first
        == 'full'
      continue-on-error: true
      working-directory: source
      env:
        CACHE_VERIFIED: "${{ steps.full_first_verified.outcome }}"
      run: |
        cache_args=()
        if [ "$CACHE_VERIFIED" = success ]; then
          cache_args=(--native-cache "$RUNNER_TEMP/native-cache")
        fi
        /usr/bin/python3 "$GITHUB_WORKSPACE/tool/examples/abseil/baseline.py" --output "$RUNNER_TEMP/native-control" "${cache_args[@]}"
    - name: Publish full native audit for full_first
      if: always() && !cancelled() && steps.order.outcome == 'success' && steps.order.outputs.first
        == 'full'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: matched-native-full-${{ github.run_attempt }}
        path: "${{ runner.temp }}/native-control"
        retention-days: 7
        if-no-files-found: error
    - name: End full_first interval and isolate its used cache
      if: always() && !cancelled() && steps.order.outcome == 'success' && steps.order.outputs.first
        == 'full' && steps.full_first_begin.outcome == 'success'
      env:
        OUTCOME: "${{ steps.full_first_run.outcome }}"
      run: /usr/bin/python3 "$RUNNER_TEMP/matched_trial.py" finish --arm full --outcome
        "$OUTCOME"
    - name: Begin smart_only measured interval
      id: smart_only_begin
      if: always() && !cancelled() && steps.order.outcome == 'success'
      run: /usr/bin/python3 "$RUNNER_TEMP/matched_trial.py" begin --arm smart
    - name: Independently restore base cache for smart_only
      id: smart_only_cache
      if: always() && !cancelled() && steps.order.outcome == 'success' && steps.identity.outcome
        == 'success'
      continue-on-error: true
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      timeout-minutes: 3
      with:
        path: "${{ runner.temp }}/native-cache"
        key: "${{ steps.identity.outputs.key }}"
    - name: Verify independent cache contents for smart_only
      id: smart_only_verified
      if: always() && !cancelled() && steps.order.outcome == 'success' && steps.smart_only_cache.outputs.cache-hit
        == 'true'
      continue-on-error: true
      timeout-minutes: 3
      run: |
        python3 tool/examples/abseil/native_cache.py --directory "$RUNNER_TEMP/native-cache" \
          --expected "$RUNNER_TEMP/native-cache-receipt/cache.json" --output "$RUNNER_TEMP/matched-evidence/smart/cache-verified.json"
    - name: Match memory-cache state before smart_only
      if: always() && !cancelled() && steps.order.outcome == 'success'
      timeout-minutes: 2
      env:
        ARM: smart
      run: |
        test -z "$(docker ps -q)"
        sudo sh -eu -c 'sync
        printf 3 > /proc/sys/vm/drop_caches'
        /usr/bin/python3 - <<'PY'
        import json,os
        from pathlib import Path
        path=Path(os.environ['RUNNER_TEMP'])/'matched-evidence'/os.environ['ARM']/'native-preparation.json'
        with path.open('x') as stream:stream.write(json.dumps({'page_cache_reset':True,'no_active_containers':True})+'\n')
        PY
    - name: Execute the unchanged published Smart CI Action
      id: smart_only_run
      if: always() && !cancelled() && steps.order.outcome == 'success' && steps.smart_only_verified.outcome
        == 'success'
      continue-on-error: true
      uses: SharmaKunal14/smart-ci@e780aeb00eb5b81c35b062c65734067c03279754
      with:
        path: source
    - name: Preserve independent cold full fallback on failed cache admission
      id: smart_only_fallback
      if: always() && !cancelled() && steps.order.outcome == 'success' && steps.smart_only_verified.outcome
        != 'success'
      continue-on-error: true
      working-directory: source
      run: /usr/bin/python3 "$GITHUB_WORKSPACE/tool/examples/abseil/baseline.py" --output
        "$RUNNER_TEMP/native-smart-fallback"
    - name: End smart_only interval and isolate its used cache
      if: always() && !cancelled() && steps.order.outcome == 'success' && steps.smart_only_begin.outcome
        == 'success'
      env:
        OUTCOME: "${{ steps.smart_only_run.outcome == 'skipped' && steps.smart_only_fallback.outcome
          || steps.smart_only_run.outcome }}"
      run: /usr/bin/python3 "$RUNNER_TEMP/matched_trial.py" finish --arm smart --outcome
        "$OUTCOME"
    - name: Begin full_second measured interval
      id: full_second_begin
      if: always() && !cancelled() && steps.order.outcome == 'success' && steps.order.outputs.first
        == 'smart'
      run: /usr/bin/python3 "$RUNNER_TEMP/matched_trial.py" begin --arm full
    - name: Independently restore base cache for full_second
      id: full_second_cache
      if: always() && !cancelled() && steps.order.outcome == 'success' && steps.order.outputs.first
        == 'smart' && steps.identity.outcome == 'success'
      continue-on-error: true
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      timeout-minutes: 3
      with:
        path: "${{ runner.temp }}/native-cache"
        key: "${{ steps.identity.outputs.key }}"
    - name: Verify independent cache contents for full_second
      id: full_second_verified
      if: always() && !cancelled() && steps.order.outcome == 'success' && steps.order.outputs.first
        == 'smart' && steps.full_second_cache.outputs.cache-hit == 'true'
      continue-on-error: true
      timeout-minutes: 3
      run: |
        python3 tool/examples/abseil/native_cache.py --directory "$RUNNER_TEMP/native-cache" \
          --expected "$RUNNER_TEMP/native-cache-receipt/cache.json" --output "$RUNNER_TEMP/matched-evidence/full/cache-verified.json"
    - name: Match memory-cache state before full_second
      if: always() && !cancelled() && steps.order.outcome == 'success' && steps.order.outputs.first
        == 'smart'
      timeout-minutes: 2
      env:
        ARM: full
      run: |
        test -z "$(docker ps -q)"
        sudo sh -eu -c 'sync
        printf 3 > /proc/sys/vm/drop_caches'
        /usr/bin/python3 - <<'PY'
        import json,os
        from pathlib import Path
        path=Path(os.environ['RUNNER_TEMP'])/'matched-evidence'/os.environ['ARM']/'native-preparation.json'
        with path.open('x') as stream:stream.write(json.dumps({'page_cache_reset':True,'no_active_containers':True})+'\n')
        PY
    - name: Execute unchanged full native suite for full_second
      id: full_second_run
      if: always() && !cancelled() && steps.order.outcome == 'success' && steps.order.outputs.first
        == 'smart'
      continue-on-error: true
      working-directory: source
      env:
        CACHE_VERIFIED: "${{ steps.full_second_verified.outcome }}"
      run: |
        cache_args=()
        if [ "$CACHE_VERIFIED" = success ]; then
          cache_args=(--native-cache "$RUNNER_TEMP/native-cache")
        fi
        /usr/bin/python3 "$GITHUB_WORKSPACE/tool/examples/abseil/baseline.py" --output "$RUNNER_TEMP/native-control" "${cache_args[@]}"
    - name: Publish full native audit for full_second
      if: always() && !cancelled() && steps.order.outcome == 'success' && steps.order.outputs.first
        == 'smart'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: matched-native-full-${{ github.run_attempt }}
        path: "${{ runner.temp }}/native-control"
        retention-days: 7
        if-no-files-found: error
    - name: End full_second interval and isolate its used cache
      if: always() && !cancelled() && steps.order.outcome == 'success' && steps.order.outputs.first
        == 'smart' && steps.full_second_begin.outcome == 'success'
      env:
        OUTCOME: "${{ steps.full_second_run.outcome }}"
      run: /usr/bin/python3 "$RUNNER_TEMP/matched_trial.py" finish --arm full --outcome
        "$OUTCOME"
    - name: Restore the Apport hook on the disposable runner
      if: always() && steps.apport.outputs.created == 'true'
      run: |
        sudo systemctl unmask --runtime apport-coredump-hook@.service
        systemctl show apport-coredump-hook@smartci-probe.service --property=LoadState --value > "$RUNNER_TEMP/runner-policy/apport-restored.txt"
        test "$(cat "$RUNNER_TEMP/runner-policy/apport-restored.txt")" = loaded
        systemctl cat apport-coredump-hook@.service > "$RUNNER_TEMP/runner-policy/apport-restored-unit.txt"
        cmp "$RUNNER_TEMP/runner-policy/apport-unit.txt" "$RUNNER_TEMP/runner-policy/apport-restored-unit.txt"
    - name: Restore disposable runner policy
      if: always() && steps.cores.outputs.created == 'true'
      run: |
        sudo rm /etc/systemd/coredump.conf.d/90-smartci-baseline.conf
        if systemctl is-active --quiet systemd-coredumpd.service; then
          sudo systemctl reload systemd-coredumpd.service
        fi
        systemd-analyze cat-config systemd/coredump.conf > "$RUNNER_TEMP/runner-policy/restored.conf"
        cmp "$RUNNER_TEMP/runner-policy/before.conf" "$RUNNER_TEMP/runner-policy/restored.conf"
    - name: Require matched evidence and propagate either native failure
      if: always() && !cancelled() && steps.order.outcome == 'success'
      run: /usr/bin/python3 "$RUNNER_TEMP/matched_trial.py" verify
    - name: Publish complete comparison and common setup evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: matched-comparison-${{ github.run_attempt }}
        path: |-
          ${{ runner.temp }}/matched-evidence
          ${{ runner.temp }}/runner-policy
          ${{ runner.temp }}/common-image.json
          ${{ runner.temp }}/native-cache-receipt
          ${{ runner.temp }}/cache-seed-run.json
          ${{ runner.temp }}/native-smart-fallback
        retention-days: 7
        if-no-files-found: error
