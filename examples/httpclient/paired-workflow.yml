name: Matched HttpClient PR comparison
on:
  pull_request:
    branches: [codex/smartci-qualification-base]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  actions: read
cache-mode: read
concurrency:
  group: smartci-httpclient-qualification
  cancel-in-progress: false
jobs:
  paired:
    if: github.repository == 'SharmaKunal14/httpcomponents-client' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: SharmaKunal14/smart-ci
          ref: TOOL_COMMIT
          path: tool
          persist-credentials: false
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        id: java21
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: '17'
      - name: Preserve the native JDK toolchain and record the environment
        env:
          TOOLCHAIN_JAVA_HOME: ${{ steps.java21.outputs.path }}
        run: |
          mkdir -p "$HOME/.m2" "$RUNNER_TEMP/evidence"
          python3 - <<'PY'
          import json, os, subprocess, xml.etree.ElementTree as E
          from pathlib import Path
          root = E.Element('toolchains'); t = E.SubElement(root, 'toolchain')
          E.SubElement(t, 'type').text = 'jdk'
          E.SubElement(E.SubElement(t, 'provides'), 'version').text = '21'
          E.SubElement(E.SubElement(t, 'configuration'), 'jdkHome').text = os.environ['TOOLCHAIN_JAVA_HOME']
          E.ElementTree(root).write(Path.home()/'.m2/toolchains.xml', encoding='utf-8', xml_declaration=True)
          out = Path(os.environ['RUNNER_TEMP'])/'evidence'
          data = {'revision': subprocess.check_output(['git','-C','source','rev-parse','HEAD'],text=True).strip(), 'java': subprocess.check_output(['java','-version'],stderr=subprocess.STDOUT,text=True), 'toolchain': subprocess.check_output([os.environ['TOOLCHAIN_JAVA_HOME']+'/bin/java','-version'],stderr=subprocess.STDOUT,text=True), 'cpu': json.loads(subprocess.check_output(['lscpu','--json'])), 'runner_image': os.environ.get('ImageVersion')}
          (out/'environment.json').write_text(json.dumps(data,sort_keys=True)+'\n')
          PY
      - name: Choose the predeclared alternating order
        id: order
        env:
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          if (( ATTEMPT % 2 )); then echo 'first=full' >> "$GITHUB_OUTPUT"; else echo 'first=smart' >> "$GITHUB_OUTPUT"; fi
      - name: Prepare full (full first)
        id: prepare_full_full
        if: always() && steps.order.outputs.first == 'full'
        run: python3 tool/examples/httpclient/paired.py prepare --arm full
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: cache_full_full
        if: always() && steps.order.outputs.first == 'full' && steps.prepare_full_full.outcome == 'success'
        with:
          path: ~/.m2/repository
          key: smartci-httpclient-qualification-e2a3100cb62a4f9db45ea7dcb9c536178a69a0aa
          fail-on-cache-miss: true
      - name: Verify independent native cache (full_full)
        id: verified_full_full
        if: always() && steps.order.outputs.first == 'full' && steps.cache_full_full.outcome == 'success'
        run: python3 tool/examples/httpclient/paired.py cache --arm full
      - name: Unchanged native full reactor (full first)
        id: run_full_full
        if: always() && steps.order.outputs.first == 'full' && steps.verified_full_full.outcome == 'success'
        continue-on-error: true
        run: python3 tool/examples/httpclient/paired.py full
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.order.outputs.first == 'full' && steps.verified_full_full.outcome == 'success'
        with:
          name: native-full-${{ github.run_attempt }}
          path: ${{ runner.temp }}/full-result
          retention-days: 7
          if-no-files-found: error
      - name: Record complete full lifecycle (full first)
        if: always() && steps.order.outputs.first == 'full' && steps.verified_full_full.outcome == 'success'
        run: python3 tool/examples/httpclient/paired.py finish --arm full
      - name: Prepare smart (full first)
        id: prepare_full_smart
        if: always() && steps.order.outputs.first == 'full'
        run: python3 tool/examples/httpclient/paired.py prepare --arm smart
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: cache_full_smart
        if: always() && steps.order.outputs.first == 'full' && steps.prepare_full_smart.outcome == 'success'
        with:
          path: ~/.m2/repository
          key: smartci-httpclient-qualification-e2a3100cb62a4f9db45ea7dcb9c536178a69a0aa
          fail-on-cache-miss: true
      - name: Verify independent native cache (full_smart)
        id: verified_full_smart
        if: always() && steps.order.outputs.first == 'full' && steps.cache_full_smart.outcome == 'success'
        run: python3 tool/examples/httpclient/paired.py cache --arm smart
      - name: Published Smart CI Action (full first)
        id: run_full_smart
        if: always() && steps.order.outputs.first == 'full' && steps.verified_full_smart.outcome == 'success'
        continue-on-error: true
        uses: ./tool/maven
        with:
          path: smart
      - name: Record complete smart lifecycle (full first)
        if: always() && steps.order.outputs.first == 'full' && steps.verified_full_smart.outcome == 'success'
        run: python3 tool/examples/httpclient/paired.py finish --arm smart
      - name: Prepare smart (smart first)
        id: prepare_smart_smart
        if: always() && steps.order.outputs.first == 'smart'
        run: python3 tool/examples/httpclient/paired.py prepare --arm smart
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: cache_smart_smart
        if: always() && steps.order.outputs.first == 'smart' && steps.prepare_smart_smart.outcome == 'success'
        with:
          path: ~/.m2/repository
          key: smartci-httpclient-qualification-e2a3100cb62a4f9db45ea7dcb9c536178a69a0aa
          fail-on-cache-miss: true
      - name: Verify independent native cache (smart_smart)
        id: verified_smart_smart
        if: always() && steps.order.outputs.first == 'smart' && steps.cache_smart_smart.outcome == 'success'
        run: python3 tool/examples/httpclient/paired.py cache --arm smart
      - name: Published Smart CI Action (smart first)
        id: run_smart_smart
        if: always() && steps.order.outputs.first == 'smart' && steps.verified_smart_smart.outcome == 'success'
        continue-on-error: true
        uses: ./tool/maven
        with:
          path: smart
      - name: Record complete smart lifecycle (smart first)
        if: always() && steps.order.outputs.first == 'smart' && steps.verified_smart_smart.outcome == 'success'
        run: python3 tool/examples/httpclient/paired.py finish --arm smart
      - name: Prepare full (smart first)
        id: prepare_smart_full
        if: always() && steps.order.outputs.first == 'smart'
        run: python3 tool/examples/httpclient/paired.py prepare --arm full
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: cache_smart_full
        if: always() && steps.order.outputs.first == 'smart' && steps.prepare_smart_full.outcome == 'success'
        with:
          path: ~/.m2/repository
          key: smartci-httpclient-qualification-e2a3100cb62a4f9db45ea7dcb9c536178a69a0aa
          fail-on-cache-miss: true
      - name: Verify independent native cache (smart_full)
        id: verified_smart_full
        if: always() && steps.order.outputs.first == 'smart' && steps.cache_smart_full.outcome == 'success'
        run: python3 tool/examples/httpclient/paired.py cache --arm full
      - name: Unchanged native full reactor (smart first)
        id: run_smart_full
        if: always() && steps.order.outputs.first == 'smart' && steps.verified_smart_full.outcome == 'success'
        continue-on-error: true
        run: python3 tool/examples/httpclient/paired.py full
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.order.outputs.first == 'smart' && steps.verified_smart_full.outcome == 'success'
        with:
          name: native-full-${{ github.run_attempt }}
          path: ${{ runner.temp }}/full-result
          retention-days: 7
          if-no-files-found: error
      - name: Record complete full lifecycle (smart first)
        if: always() && steps.order.outputs.first == 'smart' && steps.verified_smart_full.outcome == 'success'
        run: python3 tool/examples/httpclient/paired.py finish --arm full
      - name: Verify exact outcomes and report paired lifecycle costs
        if: always()
        run: python3 tool/examples/httpclient/paired.py compare
      - name: Preserve every attempt including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: matched-httpclient-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/comparison
            ${{ runner.temp }}/evidence
            full/**/target/surefire-reports/TEST-*.xml
            full/**/target/failsafe-reports/TEST-*.xml
            smart/**/target/surefire-reports/TEST-*.xml
            smart/**/target/failsafe-reports/TEST-*.xml
