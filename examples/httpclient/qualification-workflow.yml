name: Native HttpClient qualification
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
cache-mode: write
concurrency:
  group: smartci-httpclient-qualification
  cancel-in-progress: false
jobs:
  native:
    if: github.repository == 'SharmaKunal14/httpcomponents-client' && github.ref == 'refs/heads/codex/smartci-qualification-base'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: SharmaKunal14/smart-ci
          ref: 855e9db515683fc06922d40305e1cd6da92821e7
          path: tool
          persist-credentials: false
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        id: java21
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: '17'
      - name: Preserve the native JDK toolchain and record the environment
        env:
          TOOLCHAIN_JAVA_HOME: ${{ steps.java21.outputs.path }}
        run: |
          mkdir -p "$HOME/.m2" "$RUNNER_TEMP/evidence"
          python3 - <<'PY'
          import json, os, subprocess, xml.etree.ElementTree as E
          from pathlib import Path
          root = E.Element('toolchains'); t = E.SubElement(root, 'toolchain')
          E.SubElement(t, 'type').text = 'jdk'
          E.SubElement(E.SubElement(t, 'provides'), 'version').text = '21'
          E.SubElement(E.SubElement(t, 'configuration'), 'jdkHome').text = os.environ['TOOLCHAIN_JAVA_HOME']
          E.ElementTree(root).write(Path.home()/'.m2/toolchains.xml', encoding='utf-8', xml_declaration=True)
          out = Path(os.environ['RUNNER_TEMP'])/'evidence'
          data = {'revision': subprocess.check_output(['git','-C','source','rev-parse','HEAD'],text=True).strip(), 'java': subprocess.check_output(['java','-version'],stderr=subprocess.STDOUT,text=True), 'toolchain': subprocess.check_output([os.environ['TOOLCHAIN_JAVA_HOME']+'/bin/java','-version'],stderr=subprocess.STDOUT,text=True), 'cpu': json.loads(subprocess.check_output(['lscpu','--json'])), 'runner_image': os.environ.get('ImageVersion')}
          (out/'environment.json').write_text(json.dumps(data,sort_keys=True)+'\n')
          PY
      - name: Run the unchanged native clean verify and capture effective Maven models
        working-directory: source
        run: |
          python3 - <<'PY'
          import json, os, subprocess, time
          from pathlib import Path
          out = Path(os.environ['RUNNER_TEMP'])/'evidence'
          allowed = ('HOME','PATH','JAVA_HOME','LANG','LC_ALL','USER','LOGNAME','TMPDIR')
          env = {k:os.environ[k] for k in allowed if k in os.environ}
          env.update(CI='true', GITHUB_ACTIONS='true')
          args = ['./mvnw','-V','--file','pom.xml','--no-transfer-progress','-DtrimStackTrace=false','-Djunit.jupiter.execution.parallel.enabled=false','-DjavaVersion=21','-Pdocker']
          started = time.monotonic()
          print('Native full clean verify starting; native progress follows.',flush=True)
          code = subprocess.run(args,env=env,timeout=900).returncode
          report = {'native_seconds':time.monotonic()-started,'native_exit':code,'command':args}
          (out/'native.json').write_text(json.dumps(report,sort_keys=True)+'\n')
          if code: raise SystemExit(code)
          started = time.monotonic()
          print('Capturing native effective reactor models.',flush=True)
          code = subprocess.run(args+['org.apache.maven.plugins:maven-help-plugin:3.5.1:effective-pom','-Doutput='+str(out/'effective-pom.xml')],env=env,timeout=120).returncode
          report.update(model_seconds=time.monotonic()-started,model_exit=code)
          (out/'native.json').write_text(json.dumps(report,sort_keys=True)+'\n')
          raise SystemExit(code)
          PY
      - name: Bound and fingerprint the native Maven dependency cache
        run: |
          python3 tool/examples/abseil/native_cache.py --directory "$HOME/.m2/repository" --output "$RUNNER_TEMP/evidence/cache.json"
          docker image ls --digests --no-trunc --format '{{json .}}' > "$RUNNER_TEMP/evidence/docker-images.jsonl"
          git -C source status --porcelain > "$RUNNER_TEMP/evidence/source-status.txt"
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.m2/repository
          key: smartci-httpclient-qualification-${{ github.sha }}
      - name: Preserve native reports and qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-qualification-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/evidence
            source/**/target/surefire-reports/TEST-*.xml
            source/**/target/failsafe-reports/TEST-*.xml
            source/**/target/failsafe-reports/failsafe-summary.xml
